{% extends "base.html" %}

{% block title %}Erreur serveur - ROBO TUNISIE{% endblock %}

{% block extra_css %}
<style>
    .error-container {
        text-align: center;
        padding: 4rem 2rem;
        max-width: 600px;
        margin: 0 auto;
    }

    .error-code {
        font-family: 'Playfair Display', serif;
        font-size: 5rem;
        background: linear-gradient(135deg, #f472b6 0%, #a78bfa 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 0;
    }

    .error-title {
        font-size: 2rem;
        margin: 1rem 0;
        color: var(--text-light);
    }

    .error-description {
        color: var(--text-muted);
        font-size: 1.1rem;
        margin-bottom: 2rem;
    }

    .error-btn {
        background: linear-gradient(135deg, var(--accent-pink) 0%, #f472b6 100%);
        color: white;
        padding: 0.75rem 2rem;
        border: none;
        border-radius: 0.5rem;
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
        transition: transform 0.3s;
    }

    .error-btn:hover {
        transform: translateY(-2px);
    }
</style>
{% endblock %}

{% block content %}
<div class="error-container">
    <p class="error-code">500</p>
    <h1 class="error-title">Erreur Serveur</h1>
    <p class="error-description">Une erreur interne s'est produite. Nos équipes travaillent à la résoudre.</p>
    <a href="/" class="error-btn">← Retour à l'accueil</a>
</div>
{% endblock %}
